name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            node: "20"
          - python: "3.13"
            node: "22"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pip install rope mcp pytest pytest-asyncio ruff==0.15.20
      - run: npm install
        working-directory: server/tsmorph
      - run: ruff check server tests
      - run: ./scripts/test.sh
