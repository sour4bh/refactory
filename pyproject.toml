[project]
name = "refactory"
version = "1.1.0"
description = "Token-efficient codebase refactoring plugin for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "rope>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
# Lint policy is pinned here on purpose. Without an explicit select, ruff
# lints whatever its installed version happens to default to, so the same
# command passed locally and failed in CI on a newer ruff. Widening this set
# is a deliberate change, not a side effect of upgrading the tool.
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["server"]
filterwarnings = [
    "ignore:Please use `import python_multipart` instead\\.:PendingDeprecationWarning:starlette\\.formparsers",
    "ignore:Delete once deprecated functions are gone:DeprecationWarning:rope\\.base\\.project",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
